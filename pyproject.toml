[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raster-registration-toolkit"
version = "0.1.0"
description = "Tools for raster registration and RPC/DEM orthorectification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "rasterio>=1.3",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
satellite = ["GDAL>=3.6,<4"]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
rasterreg = "rasterreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
